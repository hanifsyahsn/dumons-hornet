# Netlify builds the site as static HTML (no server): every route in src/routes.ts
# is prerendered into dist/static by src/server/prerender.tsx.
[build]
  command = "npm run build:static"
  publish = "dist/static"

[build.environment]
  NODE_VERSION = "22"

# "/" -> DEFAULT_ROUTE (default /home) is written into _redirects by prerender.
# Production deploys keep showing the under-construction page until this is removed.
[context.production.environment]
  DEFAULT_ROUTE = "/under-construction"

