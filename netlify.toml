# Netlify builds the site as static HTML (no server): every route in src/routes.ts
# is prerendered into dist/static by src/server/prerender.tsx.
[build]
  command = "npm run build:static"
  publish = "dist/static"

[build.environment]
  NODE_VERSION = "22"

# Maintenance mode (src/constants/routing.ts) is not configured in git: builds of the
# "production" branch default to it. Override with the MAINTENANCE_MODE env var in the
# Netlify UI (Site configuration > Environment variables): "false" to launch.
