# Netlify builds the site as static HTML (no server): every route in src/routes.ts
# is prerendered into dist/static by src/server/prerender.tsx.
[build]
  command = "npm run build:static"
  publish = "dist/static"

[build.environment]
  NODE_VERSION = "22"

# Maintenance mode: only /under-construction is built and every other path redirects
# to it (prerender writes the rules into _redirects). On for production deploys until
# launch: set it to "false" here to go live. Even without this block, builds of the
# "production" branch default to maintenance mode (fail-safe in the webpack configs).
[context.production.environment]
  MAINTENANCE_MODE = "true"

